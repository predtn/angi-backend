name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ANGI.slnx

      - name: Build
        run: dotnet build ANGI.slnx --configuration Release --no-restore

      # Cloudinary live tests skip themselves because RUN_CLOUDINARY_LIVE_TESTS is not set.
      - name: Test
        run: >
          dotnet test ANGI.slnx --configuration Release --no-build
          --logger trx --results-directory TestResults

      # Fails when an entity or configuration changed without a migration (commit_guide.md §10).
      # The design-time host only needs these settings to start; no database is contacted.
      - name: Check for missing EF migration
        env:
          ConnectionStrings__Default: Host=localhost;Database=angi;Username=ci;Password=ci
          Jwt__SecretKey: ci-only-placeholder-secret-key-32-bytes-min
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes \
            --project ANGI.Infrastructure --startup-project ANGI.WebApi \
            --configuration Release --no-build

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
